# Electronically and vibrationally excited O2 and O from O3/O2 photolysis.
#
# This is the model that sasktran2's photochem module implemented in Rust
# code (rust/sasktran2-rs/src/photchem/models.rs) before it moved into
# sasktran2-nlte, translated entry by entry without changing any value. It
# reproduces that implementation to round-off; see
# tests/photchem/test_photchem_goldens.py.
#
# Frozen: this file stays an exact translation of the legacy model, for the
# photchem goldens and the Yankovsky shim. New work uses the audited `oxygen`
# mechanism.
#
# Known issues kept for parity:
#   * No entry has an individual literature citation yet.
#   * There is no O2(b, v=0) + N2 quenching, the main O2(b) loss below about
#     80 km, so daytime O2(b) is several times too high there.
#   * o3_o_v{v}: every O2(X, v=1..30) channel runs at the full rate, so the
#     yields effectively sum to 30 ("todo: quantum yield" in the original).
#   * O(1S) has no production pathway; its population is zero.
#
# State ids omit v=0: O2(b) is O2(b, v=0). Rate units are converted to SI on
# load; densities are m^-3.

[mechanism]
name = "oxygen_yankovsky"
version = "0.1.0"
description = "O2(X, v), O2(a, v), O2(b, v), O(1D) and O(1S) from O3 and O2 photolysis"
background = ["O2", "O3", "N2", "CO2", "O(3P)"]

[references]
legacy_photchem = """\
Carried over unchanged from the earlier sasktran2 photochem implementation of \
the Yankovsky O2/O3 photolysis-product kinetics model (Yankovsky and Manuilova, \
2006, Ann. Geophys. 24, 2823; Yankovsky et al., 2016, J. Mol. Spectrosc. 327, \
209). Individual values have not yet been checked against those papers."""

# --- States -----------------------------------------------------------------

[[state]]
id = "O(1S)"

[[state]]
id = "O(1D)"

[[state]]
id = "O2(b, v={v})"
for_v = [0, 2]

[[state]]
id = "O2(a, v={v})"
for_v = [0, 5]

[[state]]
id = "O2(X, v={v})"
for_v = [1, 35]

# --- Photolysis and photoexcitation -----------------------------------------
# Rate inputs are per molecule [s^-1] and already include quantum yields.

[[photo_reaction]]
id = "o2_src"
reactant = "O2"
products = ["O(3P)", "O(1D)"]
rate_input = "J_O2_SRC"
reference = "legacy_photchem"

[[photo_reaction]]
id = "o2_lyman_alpha"
reactant = "O2"
products = ["O(3P)", "O(1D)"]
rate_input = "J_O2_LYA"
reference = "legacy_photchem"

[[photo_reaction]]
id = "o3_o2a_v{v}"
for_v = [0, 5]
reactant = "O3"
products = ["O2(a, v={v})", "O(1D)"]
rate_input = "J_O3_A{v}"
reference = "legacy_photchem"

[[photo_reaction]]
id = "o2_excitation_b0"
reactant = "O2"
products = ["O2(b, v=0)"]
rate_input = "J_O2_EXC_B0"
reference = "legacy_photchem"

[[photo_reaction]]
id = "o2_excitation_b1"
reactant = "O2"
products = ["O2(b, v=1)"]
rate_input = "J_O2_EXC_B1"
reference = "legacy_photchem"

[[photo_reaction]]
id = "o2_excitation_b2"
reactant = "O2"
products = ["O2(b, v=2)"]
rate_input = "J_O2_EXC_B2"
reference = "legacy_photchem"

[[photo_reaction]]
id = "o2_excitation_a0"
reactant = "O2"
products = ["O2(a, v=0)"]
rate_input = "J_O2_EXC_A0"
reference = "legacy_photchem"

[[photo_reaction]]
id = "o3_o2x_v{v}"
for_v = [1, 35]
reactant = "O3"
products = ["O2(X, v={v})", "O(3P)"]
rate_input = "J_O3_X{v}"
reference = "legacy_photchem"

# --- O(1S) and O(1D) ----------------------------------------------------------

[[transition]]
id = "o1s_green_line"
upper = "O(1S)"
lower = "O(1D)"
einstein_a_s = 1.26
wavelength_nm = 557.7
reference = "legacy_photchem"

[[transition]]
id = "o1d_radiative"
upper = "O(1D)"
lower = "O(3P)"
einstein_a_s = 9.0e-3
reference = "legacy_photchem"

[[reaction]]
id = "o1d_o"
reactants = ["O(1D)", "O(3P)"]
products = ["O(3P)", "O(3P)"]
rate = { law = "constant", value = 4.0e-12, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o1d_o2"
reactants = ["O(1D)", "O2"]
rate = { law = "arrhenius", a = 3.2e-11, ea_over_r = -67.0, units = "cm3 s-1" }
channels = [
  { yield = 0.40, products = ["O2(b, v=1)", "O(3P)"] },
  { yield = 0.55, products = ["O2(b, v=0)", "O(3P)"] },
  { yield = 0.05, products = ["O2(a, v=0)", "O(3P)"] },
]
reference = "legacy_photchem"

[[reaction]]
id = "o1d_o3"
reactants = ["O(1D)", "O3"]
products = ["O2", "O2"]
rate = { law = "constant", value = 2.4e-10, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o1d_n2"
reactants = ["O(1D)", "N2"]
products = ["N2", "O(3P)"]
rate = { law = "arrhenius", a = 2.0e-11, ea_over_r = -107.0, units = "cm3 s-1" }
reference = "legacy_photchem"

# --- O2(b, v=2) ---------------------------------------------------------------

[[transition]]
id = "o2b2_x2"
upper = "O2(b, v=2)"
lower = "O2(X, v=2)"
einstein_a_s = 5.4e-2
reference = "legacy_photchem"

[[reaction]]
id = "o2b2_o"
reactants = ["O2(b, v=2)", "O(3P)"]
products = ["O2(b, v=1)", "O(3P)"]
rate = { law = "constant", value = 1.1e-11, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2b2_o2"
reactants = ["O2(b, v=2)", "O2"]
products = ["O2(X, v=2)", "O2(b, v=0)"]
rate = { law = "arrhenius", a = 1.20e-11, ea_over_r = 596.0, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2b2_n2"
reactants = ["O2(b, v=2)", "N2"]
products = ["O2(b, v=1)", "N2"]
rate = { law = "constant", value = 2.0e-14, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2b2_o3"
reactants = ["O2(b, v=2)", "O3"]
products = ["O2", "O2", "O(3P)"]
rate = { law = "constant", value = 2.9e-10, units = "cm3 s-1" }
reference = "legacy_photchem"

# --- O2(b, v=1) ---------------------------------------------------------------

[[transition]]
id = "o2b1_x1"
upper = "O2(b, v=1)"
lower = "O2(X, v=1)"
einstein_a_s = 7.0e-2
reference = "legacy_photchem"

[[reaction]]
id = "o2b1_o"
reactants = ["O2(b, v=1)", "O(3P)"]
products = ["O2(b, v=0)", "O(3P)"]
rate = { law = "constant", value = 4.5e-12, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2b1_o2"
reactants = ["O2(b, v=1)", "O2"]
products = ["O2(X, v=1)", "O2(b, v=0)"]
rate = { law = "arrhenius", a = 4.20e-11, ea_over_r = 312.0, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2b1_n2"
reactants = ["O2(b, v=1)", "N2"]
products = ["O2(b, v=0)", "N2"]
rate = { law = "constant", value = 5.0e-13, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2b1_o3"
reactants = ["O2(b, v=1)", "O3"]
products = ["O2", "O2", "O(3P)"]
rate = { law = "constant", value = 3.0e-10, units = "cm3 s-1" }
reference = "legacy_photchem"

# --- O2(b, v=0) ---------------------------------------------------------------

[[transition]]
id = "o2b0_a_band"
upper = "O2(b, v=0)"
lower = "O2"
einstein_a_s = 7.58e-2
wavelength_nm = 762.0
reference = "legacy_photchem"

[[reaction]]
id = "o2b0_o"
reactants = ["O2(b, v=0)", "O(3P)"]
rate = { law = "constant", value = 8.0e-14, units = "cm3 s-1" }
channels = [
  { yield = 0.75, products = ["O2(a, v=0)", "O(3P)"] },
  { yield = 0.25, products = ["O2", "O(3P)"] },
]
reference = "legacy_photchem"

[[reaction]]
id = "o2b0_o2"
reactants = ["O2(b, v=0)", "O2"]
rate = { law = "constant", value = 3.9e-17, units = "cm3 s-1" }
channels = [
  { yield = 0.230, products = ["O2(a, v=0)", "O2(X, v=3)"] },
  { yield = 0.525, products = ["O2(a, v=1)", "O2(X, v=2)"] },
  { yield = 0.226, products = ["O2(a, v=2)", "O2(X, v=1)"] },
  { yield = 0.019, products = ["O2(a, v=3)", "O2"] },
]
reference = "legacy_photchem"

[[reaction]]
id = "o2b0_co2"
reactants = ["O2(b, v=0)", "CO2"]
products = ["O2(a, v=0)", "CO2"]
rate = { law = "constant", value = 4.2e-13, units = "cm3 s-1" }
reference = "legacy_photchem"

# Only 30% of quenching events are tracked (to O2(a)); the rest go to
# untracked products.
[[reaction]]
id = "o2b0_o3"
reactants = ["O2(b, v=0)", "O3"]
rate = { law = "constant", value = 2.2e-11, units = "cm3 s-1" }
channels = [{ yield = 0.3, products = ["O2(a, v=0)", "O3"] }]
reference = "legacy_photchem"

# --- O2(a, v) -----------------------------------------------------------------

[[transition]]
id = "o2a0_ir_atmospheric"
upper = "O2(a, v=0)"
lower = "O2"
einstein_a_s = 2.58e-4
wavelength_nm = 1270.0
reference = "legacy_photchem"

[[transition]]
id = "o2a{v}_radiative"
for_v = [1, 5]
upper = "O2(a, v={v})"
lower = "O2"
einstein_a_s = 2.58e-4
reference = "legacy_photchem"

[[reaction]]
id = "o2a2_o2"
reactants = ["O2(a, v=2)", "O2"]
products = ["O2(X, v=2)", "O2(a, v=0)"]
rate = { law = "constant", value = 3.6e-11, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2a1_o2"
reactants = ["O2(a, v=1)", "O2"]
products = ["O2(X, v=1)", "O2(a, v=0)"]
rate = { law = "constant", value = 5.6e-11, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2a{v}_o2"
for_v = [3, 5]
reactants = ["O2(a, v={v})", "O2"]
products = ["O2(X, v={v})", "O2(a, v=0)"]
rate = { law = "constant", value = 3.6e-11, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2a1_o3"
reactants = ["O2(a, v=1)", "O3"]
products = ["O2", "O2", "O(3P)"]
rate = { law = "constant", value = 4.7e-12, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2a0_o"
reactants = ["O2(a, v=0)", "O(3P)"]
products = ["O2", "O(3P)"]
rate = { law = "constant", value = 6.5e-17, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2a{v}_o"
for_v = [1, 5]
reactants = ["O2(a, v={v})", "O(3P)"]
products = ["O2", "O(3P)"]
rate = { law = "constant", value = 1.0e-14, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2a0_o2"
reactants = ["O2(a, v=0)", "O2"]
rate = { law = "arrhenius", a = 3.6e-18, ea_over_r = 220.0, units = "cm3 s-1" }
channels = [
  { yield = 0.014, products = ["O2(X, v=5)", "O2"] },
  { yield = 0.214, products = ["O2(X, v=4)", "O2(X, v=1)"] },
  { yield = 0.772, products = ["O2(X, v=3)", "O2(X, v=2)"] },
]
reference = "legacy_photchem"

[[reaction]]
id = "o2a0_o3"
reactants = ["O2(a, v=0)", "O3"]
products = ["O2", "O3"]
rate = { law = "arrhenius", a = 5.20e-11, ea_over_r = 2840.0, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2a0_n2"
reactants = ["O2(a, v=0)", "N2"]
products = ["O2", "N2"]
rate = { law = "constant", value = 1.0e-20, units = "cm3 s-1" }
reference = "legacy_photchem"

# --- O2(X, v) -----------------------------------------------------------------

# Every channel at the full rate; see the note at the top of the file.
[[reaction]]
id = "o3_o_v{v}"
for_v = [1, 30]
reactants = ["O3", "O(3P)"]
products = ["O2(X, v={v})", "O2"]
rate = { law = "arrhenius", a = 5.60e-11, ea_over_r = 1959.0, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2x1_o"
reactants = ["O2(X, v=1)", "O(3P)"]
products = ["O2", "O(3P)"]
rate = { law = "constant", value = 3.0e-12, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2x{v}_o"
for_v = [2, 4]
reactants = ["O2(X, v={v})", "O(3P)"]
products = ["O2", "O(3P)"]
rate = { law = "arrhenius", a = 1.1e-12, n = 1.0, t0 = 300.0, exp_v = 1.0, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2x{v}_o_high"
for_v = [5, 35]
reactants = ["O2(X, v={v})", "O(3P)"]
products = ["O2", "O(3P)"]
rate = { law = "arrhenius", a = 5.0e-11, n = 0.5, t0 = 300.0, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2x1_o2"
reactants = ["O2(X, v=1)", "O2"]
products = ["O2", "O2"]
rate = { law = "arrhenius", a = 4.2e-19, n = 0.5, t0 = 300.0, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2x1_n2"
reactants = ["O2(X, v=1)", "N2"]
products = ["O2", "N2"]
rate = { law = "arrhenius", a = 4.20e-19, n = 0.5, t0 = 300.0, units = "cm3 s-1" }
reference = "legacy_photchem"

# The v=4..20 and v=21..35 families below are additional processes with the
# same reactants; their rates add to this one.
[[reaction]]
id = "o2x2_o2_vv"
reactants = ["O2(X, v=2)", "O2"]
products = ["O2(X, v=1)", "O2(X, v=1)"]
rate = { law = "constant", value = 2.0e-13, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2x{v}_o2_vv"
for_v = [3, 35]
reactants = ["O2(X, v={v})", "O2"]
products = ["O2(X, v={v-1})", "O2(X, v=1)"]
rate = { law = "constant", value = 2.6e-13, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2x{v}_o2_vv_mid"
for_v = [4, 20]
reactants = ["O2(X, v={v})", "O2"]
products = ["O2(X, v={v-1})", "O2(X, v=1)"]
rate = { law = "constant", value = 1.3e-12, exp_v = -0.31, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2x{v}_o2_vt_high"
for_v = [21, 35]
reactants = ["O2(X, v={v})", "O2"]
products = ["O2(X, v={v-1})", "O2"]
rate = { law = "arrhenius", a = 6.0e-17, n = 1.0, t0 = 300.0, exp_v = 0.2, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2x{v}_n2"
for_v = [12, 17]
reactants = ["O2(X, v={v})", "N2"]
products = ["O2(X, v={v-2})", "N2"]
rate = { law = "constant", value = 3.6e-19, exp_v = 0.66, units = "cm3 s-1" }
reference = "legacy_photchem"

[[reaction]]
id = "o2x{v}_n2_high"
for_v = [18, 26]
reactants = ["O2(X, v={v})", "N2"]
products = ["O2(X, v={v-2})", "N2"]
rate = { law = "constant", value = 4.5e-13, exp_v = -0.173, units = "cm3 s-1" }
reference = "legacy_photchem"
